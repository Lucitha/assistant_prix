[project]
name = "assistant-prix"
version = "0.2.0"
description = "Assistant Prix : prix agricoles par USSD, voix et WhatsApp (Samedis de l'IA, SLAC)"
requires-python = ">=3.12"
# Dépendances installées par Vercel (requirements.txt sert en local et pour Quality Guard)
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.18",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# Vercel : charge l'application FastAPI comme le module src.app
# (les imports « from src import ... » fonctionnent alors comme en local).
[tool.vercel]
entrypoint = "src.app:app"
